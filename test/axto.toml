[destinations.axto]
kind = "s3"
bucket = "axto"

[destinations.axto-private]
kind = "s3"
bucket = "axto-private"

[access.axto-public]

[access.axto-private]

[[uploads]]
name = "all-flac"
match = "True"
encoding = { format = "source" }
filename = "{session}/{device}/{channels}/{timestamp}.{extension}"
destination = "axto-private"
access = { profile = "axto-private" }
