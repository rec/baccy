[destinations.axto]
kind = "s3"
bucket = "axto"

[destinations.axto-private]
kind = "s3"
bucket = "axto-private"

[[uploads]]
name = "main-mp3"
match = "main and duration > 120"
encoding = { format = "mp3", bitrate_kbps = 128 }
destination = "axto"

[[uploads]]
name = "all-flac"
match = "True"
encoding = { format = "source" }
destination = "axto-private"
