[destinations.axto]
kind = "s3"
bucket = "axto"

[destinations.axto-private]
kind = "s3"
bucket = "axto-private"

[access.axto-public]

[access.axto-private]

[[uploads]]
name = "main-mp3"
match = "main and duration > 120"
encoding = { format = "mp3", bitrate_kbps = 128 }
filename = "{session}/{timestamp}.{extension}"
destination = "axto"
access = { profile = "axto-public" }

[[uploads]]
name = "all-flac"
match = "True"
encoding = { format = "flac" }
filename = "{session}/{device}/{channels}/{timestamp}.{extension}"
destination = "axto-private"
access = { profile = "axto-private" }
